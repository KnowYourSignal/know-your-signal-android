name: Robot QA

on:
  pull_request:
    paths:
      [
        'qa/**',
        'App.tsx',
        'src/**',
        'android/app/src/**',
        'supabase/**',
        'tests/**',
        'package*.json',
        '.github/workflows/robot-qa.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'qa/**',
        'App.tsx',
        'src/**',
        'android/app/src/**',
        'supabase/**',
        'tests/**',
        'package*.json',
        '.github/workflows/robot-qa.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix tests/backend --ignore-scripts --no-audit --no-fund
      - name: Validate registry and test the robot itself
        run: |
          python3 qa/robot.py validate
          python3 -m unittest discover -s qa/tests -v
          npx --no-install eslint qa --ext .jsx,.cjs --max-warnings 0
      - name: Run actual product campaign (failures are kept)
        run: python3 qa/robot.py run --output "$RUNNER_TEMP/kys-robot" --repetitions 3
      - name: Verify evidence integrity
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/kys-robot/report.json"; then
            python3 qa/verify.py "$RUNNER_TEMP/kys-robot"
          else
            echo 'No completed campaign report was produced' >&2
            exit 1
          fi
      - name: Keep complete QA evidence even when product criteria fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-qa-portable
          path: ${{ runner.temp }}/kys-robot
          if-no-files-found: error
          retention-days: 30

  native-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgis_schema: [public, extensions]
    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: backend-test-only
          POSTGRES_DB: kys_test_backend
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kys_test_backend"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PostgreSQL client
        run: |
          if ! psql --version >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 update
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends postgresql-client
          fi
          psql --version
      - name: Run existing native concurrency and SQL benchmark in disposable database
        env:
          KYS_TEST_DATABASE_URL: postgresql://postgres:backend-test-only@127.0.0.1:5432/kys_test_backend
          KYS_POSTGIS_SCHEMA: ${{ matrix.postgis_schema }}
        run: |
          python3 qa/native_backend.py --execute --output "$RUNNER_TEMP/kys-native-backend"
      - name: Retain measured SQL evidence (not Android or Cloud SLA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-native-backend-${{ matrix.postgis_schema }}
          path: |
            tests/backend/native-backend-report.json
            ${{ runner.temp }}/kys-native-backend
          if-no-files-found: error
          retention-days: 30
