name: Android client

on:
  pull_request:
    paths:
      [
        'App.tsx',
        'src/**',
        'android/**',
        '__tests__/**',
        'tests/domain/**',
        'package*.json',
        'jest.config.js',
        'tsconfig.json',
        '.github/workflows/android.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'App.tsx',
        'src/**',
        'android/**',
        '__tests__/**',
        'tests/domain/**',
        'package*.json',
        'jest.config.js',
        'tsconfig.json',
        '.github/workflows/android.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npx --no-install eslint --max-warnings 0 --ext .ts,.tsx App.tsx src __tests__ tests/domain
      - name: Bundle the Android entry point
        run: |
          mkdir -p "$RUNNER_TEMP/kys-bundle"
          npx --no-install react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/kys-bundle/index.android.bundle"

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Install Android SDK and emulator image
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' \
            'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64'
      - name: Build and run JVM tests
        working-directory: android
        run: |
          bash gradlew --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          git diff --exit-code -- app/schemas
      - name: Verify Room and the sync contract on Android
        working-directory: android
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          printf 'no\n' | avdmanager create avd --name KysCi --package 'system-images;android-35;default;x86_64' --device pixel_6
          emulator -avd KysCi -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim > "$RUNNER_TEMP/kys-emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed | tr -d "\r")" = 1 ]; do sleep 3; done'
          adb shell input keyevent 82
          bash gradlew --no-daemon --max-workers=2 -PreactNativeArchitectures=x86_64 :app:connectedDebugAndroidTest
      - name: Show emulator log on failure
        if: failure()
        run: if test -f "$RUNNER_TEMP/kys-emulator.log"; then tail -80 "$RUNNER_TEMP/kys-emulator.log"; fi
