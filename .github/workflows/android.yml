name: Android client

on:
  pull_request:
    paths:
      [
        'App.tsx',
        'src/**',
        'android/**',
        '__tests__/**',
        'tests/domain/**',
        'package*.json',
        'jest.config.js',
        'tsconfig.json',
        '.github/workflows/android.yml',
      ]
  push:
    branches: [main]
    paths:
      [
        'App.tsx',
        'src/**',
        'android/**',
        '__tests__/**',
        'tests/domain/**',
        'package*.json',
        'jest.config.js',
        'tsconfig.json',
        '.github/workflows/android.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npx --no-install eslint --max-warnings 0 --ext .ts,.tsx App.tsx src __tests__ tests/domain
      - name: Bundle the Android entry point
        run: |
          mkdir -p "$RUNNER_TEMP/kys-bundle"
          npx --no-install react-native bundle --platform android --dev false --entry-file index.js \
            --bundle-output "$RUNNER_TEMP/kys-bundle/index.android.bundle"

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api_level: [29, 35]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Prepare Android command-line tools
        run: |
          sdk="$RUNNER_TEMP/kys-android-sdk"
          tools="$RUNNER_TEMP/android-command-tools.zip"
          curl --fail --location --retry 2 --output "$tools" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '%s  %s\n' 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee "$tools" | sha256sum --check
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$tools" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk/cmdline-tools/latest/bin" "$sdk/platform-tools" "$sdk/emulator" >> "$GITHUB_PATH"
      - name: Install Android SDK and emulator image
        run: |
          (set +o pipefail; yes | sdkmanager --licenses >/dev/null)
          sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' \
            'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-${{ matrix.api_level }};default;x86_64'
      - name: Build and run JVM tests
        working-directory: android
        run: |
          gradle_args=(
            --no-daemon --max-workers=1 -PreactNativeArchitectures=x86_64
            '-Dorg.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=640m'
            -Pkotlin.compiler.execution.strategy=in-process
          )
          bash gradlew "${gradle_args[@]}" :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          bash gradlew "${gradle_args[@]}" :app:assembleQa
          bash gradlew "${gradle_args[@]}" -PkysTestBuildType=uitest :app:assembleUitest :app:assembleUitestAndroidTest
          git diff --exit-code -- app/schemas
          if unzip -Z1 app/build/outputs/apk/qa/app-qa.apk | rg 'ui_test_ca|ui-test-key'; then
            echo 'Test TLS fixtures must not be packaged in QA' >&2
            exit 1
          fi
      - name: Verify Room and the sync contract on Android
        working-directory: android
        run: |
          export ANDROID_AVD_HOME="$RUNNER_TEMP/kys-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          accel=off
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; accel=on; fi
          printf 'no\n' | avdmanager create avd --name KysCi --package 'system-images;android-${{ matrix.api_level }};default;x86_64' \
            --device pixel_4 --path "$ANDROID_AVD_HOME/KysCi.avd" --force
          test -f "$ANDROID_AVD_HOME/KysCi.ini"
          adb start-server
          emulator -avd KysCi -accel "$accel" -no-window -no-audio -gpu swiftshader_indirect \
            -feature -Vulkan -no-snapshot -no-boot-anim -memory 1536 -cores 1 > "$RUNNER_TEMP/kys-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            local result=$?
            if timeout 10 adb get-state >/dev/null 2>&1; then
              timeout 20 adb pull /sdcard/Android/data/com.knowyoursignal.uitest/files/verification "$RUNNER_TEMP/kys-ui-verification" || true
              if test "$result" -ne 0; then
                mkdir -p "$RUNNER_TEMP/kys-ui-verification"
                timeout 15 adb exec-out screencap -p > "$RUNNER_TEMP/kys-ui-verification/failure-screen.png" || true
                timeout 15 adb shell uiautomator dump /sdcard/kys-window.xml || true
                timeout 10 adb pull /sdcard/kys-window.xml "$RUNNER_TEMP/kys-ui-verification/failure-window.xml" || true
              fi
            fi
            kill "$emulator_pid" 2>/dev/null || true
            exit "$result"
          }
          trap cleanup EXIT
          timeout 300 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$1" || exit 1; sleep 3; done' _ "$emulator_pid"
          adb shell input keyevent 82
          adb install app/build/outputs/apk/debug/app-debug.apk
          adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          timeout 300 adb shell am instrument -w com.knowyoursignal.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/kys-instrumentation.log"
          awk '/^OK \([0-9]+ tests?\)/ {passed=1} END {exit !passed}' "$RUNNER_TEMP/kys-instrumentation.log"
          adb install app/build/outputs/apk/uitest/app-uitest.apk
          adb install app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk
          run_ui_phase() {
            local phase="$1" class_name="$2"
            shift 2
            timeout 420 adb shell am instrument -w -e class "com.knowyoursignal.ui.$class_name" "$@" \
              com.knowyoursignal.uitest.test/androidx.test.runner.AndroidJUnitRunner | tee "$RUNNER_TEMP/kys-ui-$phase.log"
            awk '/^OK \([0-9]+ tests?\)/ {passed=1} END {exit !passed}' "$RUNNER_TEMP/kys-ui-$phase.log"
          }
          # This independent scenario must not be blocked by an export assertion.
          run_ui_phase map-permission MapPermissionJourneyTest
          adb shell am force-stop com.knowyoursignal.uitest
          adb shell pm revoke com.knowyoursignal.uitest android.permission.ACCESS_FINE_LOCATION
          adb shell pm revoke com.knowyoursignal.uitest android.permission.ACCESS_COARSE_LOCATION
          run_ui_phase capture CaptureJourneyTest
          adb shell am force-stop com.knowyoursignal.uitest
          adb shell svc wifi disable
          adb shell svc data disable
          run_ui_phase restore HistoryRestoreTest -e restorePhase true
          adb shell am force-stop com.knowyoursignal.uitest
          adb shell svc wifi enable
          adb shell svc data enable
          run_ui_phase community CommunityMapTest
          adb shell am force-stop com.knowyoursignal.uitest
          run_ui_phase accessibility AccessibilityJourneyTest
          adb shell am force-stop com.knowyoursignal.uitest
          run_ui_phase quality CaptureQualityTest
          adb shell am force-stop com.knowyoursignal.uitest
          adb shell pm revoke com.knowyoursignal.uitest android.permission.ACCESS_FINE_LOCATION
          adb shell pm revoke com.knowyoursignal.uitest android.permission.ACCESS_COARSE_LOCATION
          run_ui_phase permissions PermissionsJourneyTest
          adb install app/build/outputs/apk/qa/app-qa.apk
          adb shell am start -n com.knowyoursignal.qa/com.knowyoursignal.MainActivity
          sleep 20
          adb shell pidof com.knowyoursignal.qa
      - name: Keep synthetic UI evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-verification-api${{ matrix.api_level }}
          path: |
            ${{ runner.temp }}/kys-ui-verification
            ${{ runner.temp }}/kys-ui-*.log
            ${{ runner.temp }}/kys-instrumentation.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Show emulator log on failure
        if: failure()
        run: if test -f "$RUNNER_TEMP/kys-emulator.log"; then tail -80 "$RUNNER_TEMP/kys-emulator.log"; fi

  qa-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      KYS_SUPABASE_URL: https://oefdpaqezvksxjgruufv.supabase.co
      # Publishable client key shipped in the APK; never use a service-role or secret key.
      KYS_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0W31t9KmyJpBoSckNfSnrw_OY4uPZ0W
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Install the pinned Android build tools
        run: |
          sdk="$RUNNER_TEMP/kys-qa-sdk"
          tools="$RUNNER_TEMP/android-command-tools.zip"
          curl --fail --location --retry 2 --output "$tools" https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          printf '%s  %s\n' 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee "$tools" | sha256sum --check
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$tools" -d "$sdk/cmdline-tools"
          mv "$sdk/cmdline-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          (set +o pipefail; yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --licenses >/dev/null)
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1' 'platform-tools'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
      - name: Build configured ARM64 QA
        working-directory: android
        run: |
          bash gradlew --no-daemon --max-workers=1 -PreactNativeArchitectures=arm64-v8a \
            '-Dorg.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=640m' \
            -Pkotlin.compiler.execution.strategy=in-process :app:assembleQa
      - name: Verify and package the internal test delivery
        run: |
          delivery="$RUNNER_TEMP/kys-qa-delivery"
          apk="android/app/build/outputs/apk/qa/app-qa.apk"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p "$delivery"
          "$tools/apksigner" verify --print-certs "$apk" > "$delivery/verification.txt"
          "$tools/zipalign" -c -P 16 4 "$apk" >> "$delivery/verification.txt"
          "$tools/aapt" dump badging "$apk" | head -6 >> "$delivery/verification.txt"
          if unzip -Z1 "$apk" | rg 'ui_test_ca|ui-test-key'; then exit 1; fi
          cp "$apk" "$delivery/KnowYourSignal-QA-arm64.apk"
          sha256sum "$delivery/KnowYourSignal-QA-arm64.apk" > "$delivery/sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: KnowYourSignal-QA-arm64
          path: ${{ runner.temp }}/kys-qa-delivery
          retention-days: 14
