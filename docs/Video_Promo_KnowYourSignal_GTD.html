      font-size: 14px;

    const W = 1920, H = 1080;
    const DURATION = 30.0;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('statusText');

    const imgs = {};
    let loaded = 0;
    const keys = Object.keys(ASSETS);
    keys.forEach(k => {
      const im = new Image();
      im.onload = () => { if (++loaded === keys.length) requestAnimationFrame(loop); };
      im.src = ASSETS[k];
      imgs[k] = im;
    });

    const clamp01 = v => Math.max(0, Math.min(1, v));
    const easeOutExpo = t => { t = clamp01(t); return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); };
    const easeOutBack = t => {
      t = clamp01(t);
      const c1 = 1.45, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const easeInOut = t => { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

    function rr(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawLogo(x, y, size, anim = 1) {
      ctx.save();
      rr(x, y, size, size, size * 0.24);
      const lg = ctx.createLinearGradient(x, y, x + size, y + size);
      lg.addColorStop(0, '#2E70FF');
      lg.addColorStop(1, '#1646C7');
      ctx.fillStyle = lg;
      ctx.fill();
      const pad = size * 0.21;
      const inner = size - pad * 2;
      const bw = inner * 0.135;
      const gap = (inner - bw * 5) / 4;
      const hs = [0.24, 0.40, 0.56, 0.74, 0.94];
      ctx.fillStyle = '#FFFFFF';
      hs.forEach((f, i) => {
        const p = easeOutBack((anim - i * 0.08) / 0.45);
        const bh = Math.max(3, inner * f * clamp01(p));
        rr(x + pad + i * (bw + gap), y + size - pad - bh, bw, bh, bw * 0.4);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawDynamicBackdrop(t, accentX = 0.7, accentColor = 'rgba(32, 93, 245, 0.34)') {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#050F24');
      g.addColorStop(0.5, '#0A1C3F');
      g.addColorStop(1, '#0E2754');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // Animated soft light sweep
      const cx = W * accentX + Math.sin(t * 1.1) * 70;
      const cy = H * 0.48 + Math.cos(t * 0.9) * 45;
      const rg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 680);
      rg.addColorStop(0, accentColor);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);

      // Subtle floating signal particles
      ctx.fillStyle = 'rgba(147, 197, 253, 0.16)';
      for (let i = 0; i < 18; i++) {
        const px = ((i * 217 + t * (28 + (i % 4) * 12)) % (W + 100)) - 50;
        const py = ((i * 139 + Math.sin(t * 0.8 + i) * 45) % H + H) % H;
        const r = 2 + (i % 3) * 1.4;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPhone(img, cx, cy, phoneH, opts = {}) {
      const {
        scale = 1,
        rot = 0,
        alpha = 1,
        zoom = 1,
        panY = 0,
        glow = 'rgba(32, 93, 245, 0.42)',
        pulseRing = null,
      } = opts;
      const pw = phoneH * 0.47 * scale;
      const ph = phoneH * scale;

      ctx.save();
      ctx.globalAlpha = clamp01(alpha);
      ctx.translate(cx, cy);
      ctx.rotate(rot);

      // Ambient behind-phone glow
      const gg = ctx.createRadialGradient(0, 0, pw * 0.2, 0, 0, ph * 0.65);
      gg.addColorStop(0, glow);
      gg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gg;
      ctx.fillRect(-ph, -ph, ph * 2, ph * 2);

      // Phone chassis
      ctx.shadowColor = 'rgba(0,0,0,0.72)';
      ctx.shadowBlur = 55;
      ctx.shadowOffsetY = 26;
      rr(-pw / 2 - 14, -ph / 2 - 14, pw + 28, ph + 28, 44);
      ctx.fillStyle = '#0B1325';
      ctx.fill();
      ctx.shadowColor = 'transparent';

      rr(-pw / 2 - 14, -ph / 2 - 14, pw + 28, ph + 28, 44);
      ctx.strokeStyle = 'rgba(147, 197, 253, 0.55)';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Clipped real app screenshot with smooth Ken Burns zoom/pan
      ctx.save();
      rr(-pw / 2, -ph / 2, pw, ph, 32);
      ctx.clip();
      const dw = pw * zoom;
      const dh = ph * zoom;
      ctx.drawImage(img, -dw / 2, -dh / 2 + panY * ph, dw, dh);

      // Optional animated spotlight ring directly over a real UI element
      if (pulseRing) {
        const { rx, ry, color, phase } = pulseRing;
        const px = -pw / 2 + pw * rx;
        const py = -ph / 2 + ph * ry;
        const p1 = (phase % 1);
        ctx.beginPath();
        ctx.arc(px, py, 18 + p1 * 58, 0, Math.PI * 2);
        ctx.strokeStyle = color.replace('ALPHA', (0.85 * (1 - p1)).toFixed(2));
        ctx.lineWidth = 5;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fillStyle = color.replace('ALPHA', '0.95');
        ctx.fill();
      }
      ctx.restore();
      ctx.restore();
    }

    function drawChip(x, y, text, accent = '#205DF5', alpha = 1) {
      ctx.save();
      ctx.globalAlpha = clamp01(alpha);
      ctx.font = '700 22px "Segoe UI", sans-serif';
      const tw = ctx.measureText(text).width;
      rr(x, y, tw + 46, 52, 26);
      ctx.fillStyle = 'rgba(13, 33, 72, 0.92)';
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(x + 22, y + 26, 6, 0, Math.PI * 2);
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.fillStyle = '#F8FAFC';
      ctx.fillText(text, x + 38, y + 34);
      ctx.restore();
    }

    // SCENE 1 (0 - 5.0 s): EMOTIONAL HOOK — PAIN TO PROMISE
    function scene1(t) {
      drawDynamicBackdrop(t, 0.5, t < 2.6 ? 'rgba(220, 38, 38, 0.25)' : 'rgba(32, 93, 245, 0.42)');
      ctx.textAlign = 'center';

      if (t < 2.55) {
        const p = easeOutExpo(t / 0.65);
        const fadeOut = clamp01((2.55 - t) / 0.35);
        ctx.save();
        ctx.globalAlpha = p * fadeOut;

        // Weak flickering signal icon
        const cx = W / 2, cy = 300;
        for (let i = 0; i < 4; i++) {
          const on = i === 0 || (i === 1 && Math.sin(t * 14) > 0);
          ctx.fillStyle = on ? '#EF4444' : 'rgba(255,255,255,0.14)';
          const bh = 28 + i * 24;
          rr(cx - 72 + i * 38, cy + 50 - bh, 24, bh, 8);
          ctx.fill();
        }

        ctx.fillStyle = '#FCA5A5';
        ctx.font = '700 26px "Segoe UI", sans-serif';
        ctx.fillText('SE CORTA LA VIDEOCONFERENCIA EN EL SEGUNDO PISO', cx, 435);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 78px "Segoe UI", sans-serif';
        const ySlide = (1 - p) * 40;
        ctx.fillText('¿Dónde se pierde realmente', cx, 540 + ySlide);
        ctx.fillStyle = '#66A3FF';
        ctx.fillText('tu señal dentro de casa?', cx, 632 + ySlide);
        ctx.restore();
      } else {
        const lt = t - 2.55;
        const p = easeOutExpo(lt / 0.65);
        const out = clamp01((5.0 - t) / 0.35);
        ctx.save();
        ctx.globalAlpha = p * out;

        const cx = W / 2, cy = 340;
        for (let i = 0; i < 3; i++) {
          const ph = (lt * 0.8 + i * 0.33) % 1;
          ctx.beginPath();
          ctx.arc(cx, cy, 85 + ph * 340, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(102, 163, 255, ' + (0.45 * (1 - ph)).toFixed(2) + ')';
          ctx.lineWidth = 4;
          ctx.stroke();
        }
        drawLogo(cx - 90, cy - 90, 180, lt / 0.75);

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 84px "Segoe UI", sans-serif';
        ctx.fillText('Deja de adivinar.', cx, 585 + (1 - p) * 35);
        ctx.fillStyle = '#5EEAD4';
        ctx.font = '800 68px "Segoe UI", sans-serif';
        ctx.fillText('Mídelo en segundos.', cx, 675 + (1 - p) * 35);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = '600 28px "Segoe UI", sans-serif';
        ctx.fillText('Know Your Signal · Cobertura interior inteligente para GTD', cx, 755);
        ctx.restore();
      }
      ctx.textAlign = 'left';
    }

    // SCENE 2 (5.0 - 11.2 s): PRECISION INDOORS — PIN-DROP & FLOOR
    function scene2(st) {
      const dur = 6.2;
      drawDynamicBackdrop(st + 5, 0.72, 'rgba(32, 93, 245, 0.36)');
      const en = easeOutExpo(st / 0.7);
      const ex = clamp01((dur - st) / 0.4);
      const a = en * ex;

      ctx.save();
      ctx.globalAlpha = a;
      const lx = 110 + (1 - en) * -60;
      ctx.fillStyle = '#66A3FF';
      ctx.font = '800 24px "Segoe UI", sans-serif';
      ctx.fillText('01 · PRECISIÓN PISO A PISO', lx, 225);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 72px "Segoe UI", sans-serif';
      ctx.fillText('Ubica cada punto', lx, 325);
      ctx.fillText('con exactitud real.', lx, 408);

      ctx.fillStyle = '#CBD5E1';
      ctx.font = '400 30px "Segoe UI", sans-serif';
      ctx.fillText('Mide Wi-Fi, 4G LTE o 5G en segundos,', lx, 492);
      ctx.fillText('elige el piso y ajusta el pin dentro de tu casa.', lx, 536);

      drawChip(lx, 615, 'Wi-Fi · 4G LTE · 5G en un toque', '#205DF5', easeOutExpo((st - 0.5) / 0.5) * ex);
      drawChip(lx, 690, 'Pin-Drop inteligente dentro de tu recinto', '#0F766E', easeOutExpo((st - 0.85) / 0.5) * ex);
      drawChip(lx, 765, 'Diferencia Piso 0, Piso 1, Piso 2 y subterráneos', '#D97706', easeOutExpo((st - 1.2) / 0.5) * ex);
      ctx.restore();

      const zoom = 1.0 + 0.14 * easeInOut((st - 1.2) / 3.8);
      const panY = -0.06 * easeInOut((st - 1.2) / 3.8);
      drawPhone(imgs.pindrop, 1410 + (1 - en) * 140, 545, 860, {
        scale: 0.94 + 0.06 * en,
        rot: -0.025 + Math.sin(st * 1.1) * 0.012,
        alpha: a,
        zoom,
        panY,
        pulseRing: st > 1.0 ? { rx: 0.61, ry: 0.68, color: 'rgba(239, 68, 68, ALPHA)', phase: st * 1.1 } : null,
      });
    }

    // SCENE 3 (11.2 - 17.6 s): INSTANT CLARITY ON GOOGLE MAPS
    function scene3(st) {
      const dur = 6.4;
      drawDynamicBackdrop(st + 11, 0.28, 'rgba(15, 118, 110, 0.36)');
      const en = easeOutExpo(st / 0.7);
      const ex = clamp01((dur - st) / 0.4);
      const a = en * ex;

      // Phone on LEFT this time for kinetic visual rhythm!
      const zoom = 1.0 + 0.15 * easeInOut((st - 1.0) / 4.0);
      const panY = 0.04 * easeInOut((st - 1.0) / 4.0);
      drawPhone(imgs.dbmmap, 490 - (1 - en) * 140, 545, 860, {
        scale: 0.94 + 0.06 * en,
        rot: 0.025 + Math.cos(st * 1.1) * 0.012,
        alpha: a,
        zoom,
        panY,
        glow: 'rgba(15, 118, 110, 0.45)',
        pulseRing: st > 0.9 ? { rx: 0.62, ry: 0.27, color: 'rgba(16, 185, 129, ALPHA)', phase: st * 1.2 } : null,
      });

      ctx.save();
      ctx.globalAlpha = a;
      const rx = 910 + (1 - en) * 60;
      ctx.fillStyle = '#5EEAD4';
      ctx.font = '800 24px "Segoe UI", sans-serif';
      ctx.fillText('02 · CLARIDAD INMEDIATA PARA TODOS', rx, 225);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 70px "Segoe UI", sans-serif';
      ctx.fillText('Entiende tu cobertura', rx, 325);
      ctx.fillText('de un solo vistazo.', rx, 406);

      ctx.fillStyle = '#CBD5E1';
      ctx.font = '400 30px "Segoe UI", sans-serif';
      ctx.fillText('Colores simples para el usuario final.', rx, 490);
      ctx.fillText('Modo técnico dBm cuando el especialista lo pide.', rx, 534);

      // Traffic light visual legend
      const dots = [
        { c: '#10B981', t: 'Verde · Favorable', s: 'Streaming, gaming y videollamadas fluidas' },
        { c: '#F59E0B', t: 'Amarillo · Intermedia', s: 'Navegación estable · oportunidad de mejora' },
        { c: '#EF4444', t: 'Rojo · Débil', s: 'Zona muerta detectada · requiere acción' },
      ];
      dots.forEach((d, i) => {
        const dp = easeOutExpo((st - 0.45 - i * 0.25) / 0.5);
        const y = 605 + i * 94;
        ctx.save();
        ctx.globalAlpha = a * dp;
        rr(rx, y, 880, 76, 16);
        ctx.fillStyle = 'rgba(13, 33, 72, 0.88)';
        ctx.fill();
        ctx.strokeStyle = d.c;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(rx + 36, y + 38, 12, 0, Math.PI * 2);
        ctx.fillStyle = d.c;
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '700 24px "Segoe UI", sans-serif';
        ctx.fillText(d.t, rx + 66, y + 34);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = '400 19px "Segoe UI", sans-serif';
        ctx.fillText(d.s, rx + 66, y + 61);
        ctx.restore();
      });
      ctx.restore();
    }

    // SCENE 4 (17.6 - 24.0 s): OFFLINE HISTORY + EXECUTIVE PNG EVIDENCE
    function scene4(st) {
      const dur = 6.4;
      drawDynamicBackdrop(st + 17, 0.65, 'rgba(32, 93, 245, 0.38)');
      const en = easeOutExpo(st / 0.7);
      const ex = clamp01((dur - st) / 0.4);
      const a = en * ex;

      ctx.save();
      ctx.globalAlpha = a;
      const lx = 96 + (1 - en) * -50;
      ctx.fillStyle = '#93C5FD';
      ctx.font = '800 24px "Segoe UI", sans-serif';
      ctx.fillText('03 · FUNCIONA SIN INTERNET · EVIDENCIA EN 1 TOQUE', lx, 215);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 66px "Segoe UI", sans-serif';
      ctx.fillText('Convierte un reclamo', lx, 308);
      ctx.fillText('en evidencia lista', lx, 384);
      ctx.fillStyle = '#5EEAD4';
      ctx.fillText('para soporte GTD.', lx, 460);

      ctx.fillStyle = '#CBD5E1';
      ctx.font = '400 28px "Segoe UI", sans-serif';
      ctx.fillText('Guarda tus recorridos incluso sin conexión', lx, 540);
      ctx.fillText('y comparte un reporte PNG profesional por WhatsApp.', lx, 582);

      drawChip(lx, 650, 'Sin conexión en subterráneos y edificios', '#205DF5', easeOutExpo((st - 0.4) / 0.5) * ex);
      drawChip(lx, 725, 'Reporte PNG ejecutivo con mapa y diagnóstico', '#0F766E', easeOutExpo((st - 0.75) / 0.5) * ex);
      drawChip(lx, 800, 'Privacidad primero: tú decides si aportas', '#66A3FF', easeOutExpo((st - 1.1) / 0.5) * ex);
      ctx.restore();

      // Dual real phones fanning dynamically!
      drawPhone(imgs.offline, 1180, 560, 740, {
        scale: 0.92 + 0.08 * en,
        rot: -0.07,
        alpha: a * 0.92,
        glow: 'rgba(32, 93, 245, 0.28)',
      });
      drawPhone(imgs.historymap, 1520, 530, 810, {
        scale: 0.92 + 0.08 * easeOutExpo((st - 0.3) / 0.7),
        rot: 0.05,
        alpha: a,
        zoom: 1.0 + 0.09 * easeInOut(st / 5.5),
        glow: 'rgba(15, 118, 110, 0.45)',
      });
    }

    // SCENE 5 (24.0 - 30.0 s): POWERFUL BRAND FINALE
    function scene5(st) {
      drawDynamicBackdrop(st + 24, 0.5, 'rgba(32, 93, 245, 0.44)');
      const en = easeOutExpo(st / 0.8);
      ctx.save();
      ctx.globalAlpha = en;
      ctx.textAlign = 'center';
      const cx = W / 2;

      for (let i = 0; i < 3; i++) {
        const ph = (st * 0.65 + i * 0.33) % 1;
        ctx.beginPath();
        ctx.arc(cx, 275, 80 + ph * 310, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(94, 234, 212, ' + (0.35 * (1 - ph)).toFixed(2) + ')';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      drawLogo(cx - 84, 190, 168, st / 0.7);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 88px "Segoe UI", sans-serif';
      ctx.fillText('Know Your Signal', cx, 470);

      ctx.fillStyle = '#66A3FF';
      ctx.font = '700 38px "Segoe UI", sans-serif';
      ctx.fillText('Menos visitas a ciegas. Mejor experiencia para cada cliente.', cx, 542);

      // Value pills row
      const vals = [
        { k: 'Clientes GTD', v: 'Diagnóstico claro en segundos', c: '#205DF5' },
        { k: 'Cuadrillas en Terreno', v: 'Evidencia por piso y red', c: '#0F766E' },
        { k: 'Decisión Corporativa', v: 'Mapa vivo y privado', c: '#D97706' },
      ];
      vals.forEach((item, i) => {
        const vp = easeOutExpo((st - 0.55 - i * 0.2) / 0.55);
        const vx = 255 + i * 480;
        ctx.save();
        ctx.globalAlpha = en * vp;
        rr(vx, 635, 440, 150, 22);
        ctx.fillStyle = 'rgba(13, 33, 72, 0.92)';
        ctx.fill();
        ctx.strokeStyle = item.c;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '800 30px "Segoe UI", sans-serif';
        ctx.fillText(item.k, vx + 220, 698);
        ctx.fillStyle = '#CBD5E1';
        ctx.font = '500 22px "Segoe UI", sans-serif';
        ctx.fillText(item.v, vx + 220, 745);
        ctx.restore();
      });

      if (imgs.uss) {
        ctx.drawImage(imgs.uss, cx - 42, 845, 84, 84);
      }
      ctx.fillStyle = '#94A3B8';
      ctx.font = '600 21px "Segoe UI", sans-serif';
      ctx.fillText('Desafío Corporativo GTD · Solución Suite Puente · Disponible para Android', cx, 975);
      ctx.textAlign = 'left';
      ctx.restore();
    }

    function drawTopBar(t) {
      if (t < 5.0 || t >= 24.0) return;
      drawLogo(60, 42, 52, 1);
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '800 24px "Segoe UI", sans-serif';
      ctx.fillText('Know Your Signal', 126, 76);
      ctx.fillStyle = 'rgba(147, 197, 253, 0.85)';
      ctx.font = '700 18px "Segoe UI", sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText('DESAFÍO GTD', W - 64, 76);
      ctx.textAlign = 'left';
    }

    function render(t) {
      if (t < 5.0) scene1(t);
      else if (t < 11.2) scene2(t - 5.0);
      else if (t < 17.6) scene3(t - 11.2);
      else if (t < 24.0) scene4(t - 17.6);
      else scene5(t - 24.0);

      drawTopBar(t);

      // Sleek bottom progress bar
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, H - 7, W, 7);
      ctx.fillStyle = '#205DF5';
      ctx.fillRect(0, H - 7, W * clamp01(t / DURATION), 7);
    }

    let playing = true, cur = 0, lastTs = null, recorder = null, chunks = [];
    const fmt = s => '00:' + String(Math.floor(s)).padStart(2, '0');

    function loop(ts) {
      if (lastTs === null) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      if (playing) {
        cur += dt;
        if (cur >= DURATION) {
          if (recorder && recorder.state === 'recording') {
            cur = DURATION;
            render(cur);
            recorder.stop();
            playing = false;
          } else {
            cur = 0;
          }
        }
      }
      render(cur);
      statusEl.textContent =
        (recorder && recorder.state === 'recording' ? '🔴 Grabando 1080p · ' : playing ? '▶ Reproduciendo · ' : '⏸ Pausado · ') +
        fmt(cur) + ' / 00:30';
      requestAnimationFrame(loop);
    }

    document.getElementById('btnPlay').onclick = () => { playing = !playing; lastTs = null; };
    document.getElementById('btnRestart').onclick = () => { cur = 0; playing = true; lastTs = null; };
    document.getElementById('btnFull').onclick = () => {
      const el = document.getElementById('stageWrap');
      if (!document.fullscreenElement) el.requestFullscreen();
      else document.exitFullscreen();
    };
    document.getElementById('btnExport').onclick = () => {
      if (recorder && recorder.state === 'recording') return;
      const stream = canvas.captureStream(60);
      const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
      chunks = [];
      recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 10000000 });
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'KnowYourSignal_Spot_Comercial_GTD_1080p.webm';
        a.click();
        statusEl.textContent = '✅ Descargado: KnowYourSignal_Spot_Comercial_GTD_1080p.webm';
      };
      cur = 0; playing = true; lastTs = null;
      recorder.start();
    };
  </script>
